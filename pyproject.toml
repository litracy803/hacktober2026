[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tritonradar"
version = "0.1.0"
description = "Evidence-backed UCSD organization discovery for TritonRadar"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.29",
]

[project.scripts]
tritonradar = "tritontrail.cli:main"

[tool.setuptools.packages.find]
include = ["tritontrail*"]
